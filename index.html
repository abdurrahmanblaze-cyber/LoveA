<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdur Rahman Shihab ❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
    }

    canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .name {
        position: absolute;
        bottom: 8%;
        width: 100%;
        text-align: center;

        color: #ff1a1a;
        font-size: clamp(20px, 5vw, 38px);
        font-weight: bold;
        letter-spacing: 3px;

        text-shadow:
            0 0 5px #ff0000,
            0 0 15px #ff0000,
            0 0 30px #ff0000;

        opacity: 0;
        animation: nameIn 2s ease forwards;
        animation-delay: 2s;
    }

    .sub {
        position: absolute;
        bottom: 4%;
        width: 100%;
        text-align: center;

        color: #777;
        font-size: 11px;
        letter-spacing: 4px;

        opacity: 0;
        animation: subIn 2s ease forwards;
        animation-delay: 3s;
    }

    @keyframes nameIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes subIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }
</style>
</head>

<body>

<canvas id="heartCanvas"></canvas>

<div class="name">
    Abdur Rahman Shihab
</div>

<div class="sub">
    MADE WITH ❤️
</div>

<script>

const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

let W, H;
let hearts = [];
let startTime = performance.now();

function resize() {

    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    hearts = [];

    for (let i = 0; i < 16; i++) {

        hearts.push({
            scale: 0.55 + i * 0.075,
            progress: 0,
            delay: i * 120
        });

    }
}

window.addEventListener("resize", resize);
resize();


// Heart equation
function heartPoint(t, scale) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x * scale,
        y: -y * scale
    };
}


// Draw glowing heart
function drawHeart(heart, elapsed) {

    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2 - 20;

    const totalPoints = 180;

    let progress =
        Math.max(
            0,
            Math.min(
                1,
                (elapsed - heart.delay) / 1100
            )
        );

    if (progress <= 0) return;

    const points =
        Math.floor(totalPoints * progress);

    ctx.beginPath();

    for (let i = 0; i <= points; i++) {

        const t =
            (Math.PI * 2 * i) / totalPoints;

        const p =
            heartPoint(t, heart.scale);

        const x =
            centerX + p.x * 7;

        const y =
            centerY + p.y * 7;

        if (i === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }

    ctx.strokeStyle = "#ff0000";
    ctx.lineWidth = 2.2;

    ctx.shadowColor = "#ff0000";
    ctx.shadowBlur = 8;

    ctx.stroke();

    ctx.shadowBlur = 0;
}


// Animation
function animate(now) {

    const elapsed =
        now - startTime;

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    hearts.forEach(heart => {
        drawHeart(heart, elapsed);
    });

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);


// Restart animation when screen is tapped
document.addEventListener("click", () => {

    startTime = performance.now();

});


// Also restart on touch
document.addEventListener("touchstart", () => {

    startTime = performance.now();

});

</script>

</body>
</html>
